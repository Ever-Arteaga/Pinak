<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10123a" />
  <title>Sin conexión — PINAK</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#f7f7f4;color:#1b1c29;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
    main{max-width:340px;text-align:center}
    img{height:72px;width:auto;margin-bottom:24px}
    h1{font-size:20px;margin:0 0 8px;color:#10123a}
    p{margin:0 0 24px;color:#5c5f72;line-height:1.5;font-size:15px}
    button{background:#10123a;color:#fff;border:0;border-radius:10px;padding:12px 24px;font-size:15px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/pinak-mark.png" alt="PINAK" />
    <h1>Sin conexión</h1>
    <p>PINAK necesita internet para mostrar tus números. Reconéctate e inténtalo de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
